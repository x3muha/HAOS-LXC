name: Upstream image build probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/image-probe.yml'
permissions:
  contents: read
jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_MEMSIZE: '2048'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Install disk inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-guestfs libguestfs-tools linux-image-generic xz-utils
          sudo chmod a+r /boot/vmlinuz-*
      - name: Verify, extract and generate boot probe
        run: sh tools/build_probe.sh out/verified-build
      - name: Publish diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-probe-reports
          if-no-files-found: warn
          path: |
            out/verified-build/slot-a/manifest.json
            out/verified-build/probe/manifest.json
            out/verified-build/audit.json
            out/verified-build/upstream-image.sha256
            out/verified-build/upstream-identity.txt
          retention-days: 7
